<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Curb — sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="login-wrap">
  <div class="wordmark">CURB<span class="wordmark-dot">.</span></div>
  <form class="login-card" method="post" action="/login">
    <label class="field"><span class="field-label">Owner password</span>
      <input type="password" name="password" autocomplete="current-password" autofocus required></label>
    <!--ERROR-->
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
